<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1a1a2e" />
    <title>Broadcast Studio</title>
    <script>
      (function () {
        if (!location.pathname.endsWith('/oauth/twitch/complete')) return
        var params = new URLSearchParams(location.search)
        var twitch = params.get('twitch')
        if (twitch !== 'connected' && twitch !== 'error') return
        var sessionId = params.get('oauth_session') || 'latest'
        var payload = JSON.stringify({
          sessionId: sessionId,
          result: twitch === 'connected' ? 'connected' : 'error',
          message: params.get('message') || undefined,
          connectionId: params.get('connection_id') || undefined,
          at: Date.now(),
        })
        try {
          localStorage.setItem('studio:twitch-oauth-result:' + sessionId, payload)
          localStorage.setItem('studio:twitch-oauth-result:latest', payload)
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
